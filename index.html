<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Правила официальных чатов FernieX</title>
<style>
:root{--bg:#0e0d0d;--panel:#171718;--panel2:#1d1d1f;--line:rgba(255,255,255,.08);--tx:#f1eee8;--mut:#9a9893;--acc:#d2504a;--accbg:rgba(210,80,74,.14);--pill:#efece6;--pilltx:#151515;--glow:rgba(150,40,30,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2ee;--panel:#fff;--panel2:#f6f4f0;--line:rgba(0,0,0,.09);--tx:#18181a;--mut:#6c6a66;--acc:#c0382f;--accbg:rgba(192,56,47,.1);--pill:#18181a;--pilltx:#f4f2ee;--glow:rgba(210,90,70,.18)}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "Manrope","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background-image:radial-gradient(900px 500px at 0% 0%,var(--glow),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(120,70,20,.14),transparent 60%);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.01em;padding:2px 4px}
.logo i{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--acc);margin-right:7px;vertical-align:middle}
.me{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.me img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.me b{display:block;font-size:13px}.me span{font-size:11px;color:var(--mut)}
nav{position:relative;display:flex;flex-direction:column;gap:6px}
nav a{display:block;color:var(--tx);text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;transition:background .15s,color .15s}
nav a:hover{background:var(--panel2)}
nav a.on{background:transparent;color:var(--pilltx);border-color:transparent}
nav a:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);min-height:230px;display:flex;align-items:flex-end}
.artw{position:absolute;inset:-30px}.art{width:100%;height:100%;object-fit:cover;display:block;filter:blur(26px) saturate(1.3) brightness(.55);transform:scale(1.1);transition:transform .3s ease-out}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--panel) 2%,transparent 75%)}
.hero .in{position:relative;z-index:1;padding:24px;display:flex;gap:20px;align-items:flex-end;width:100%;flex-wrap:wrap}
.pic img{display:block;transition:transform .25s ease-out;width:104px;height:104px;border-radius:24px;object-fit:cover;border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.hero h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px);letter-spacing:-.025em;line-height:1.1}
.hero p{margin:0;color:var(--mut);max-width:52ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
.bar input{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:10px 14px;font:inherit}
.tabs{position:relative;display:flex;gap:4px;background:var(--panel2);border-radius:12px;padding:4px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer}
.tab.on{color:var(--pilltx)}
section{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
section h2{margin:0 0 14px;font-size:17px;letter-spacing:-.01em}
.rule{position:relative;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px}
.n{grid-row:span 3;width:44px;height:30px;border-radius:9px;background:var(--accbg);color:var(--acc);font-weight:800;font-size:13px;display:grid;place-items:center}
.rule h3{margin:0;font-size:14.5px}
.rule p{margin:0;color:var(--mut);max-width:75ch}
.pun{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.pun span{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 9px}
.pun span.hot{background:var(--accbg);color:var(--acc);border-color:transparent}
.pun em{color:var(--mut);font-style:normal;font-size:12px}
.note{color:var(--mut);font-size:12.5px;margin:14px 2px 0;border-left:2px solid var(--acc);padding-left:12px}
.empty{display:none;text-align:center;color:var(--mut);padding:40px}

nav a{position:relative;z-index:1;overflow:hidden;transition:background-color .35s,color .3s .1s,transform .2s;animation:slideL .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*55ms + 150ms)}
nav a:hover{transform:translateX(4px)}
.tab{position:relative;z-index:1;overflow:hidden;transition:color .3s .1s;animation:chipPop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k)*40ms + 350ms)}
.tab:hover{color:var(--tx)}.tab.on:hover{color:var(--pilltx)}
.ind{position:absolute;left:0;top:0;z-index:0;background:var(--pill);border-radius:12px;pointer-events:none;width:0;height:0}
.ready .ind{transition:transform .55s cubic-bezier(.3,1.35,.5,1),width .45s cubic-bezier(.3,1.2,.5,1),height .45s}
.tabs .ind{border-radius:9px}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none}
body:before{content:"";position:fixed;width:560px;height:560px;border-radius:50%;left:-120px;top:-120px;z-index:-1;pointer-events:none;background:radial-gradient(circle,rgba(210,80,74,.17),transparent 65%);animation:blob 20s ease-in-out infinite alternate}
.logo i{animation:dot 2.2s ease-out infinite}
.me img{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}.me:hover img{transform:rotate(-8deg) scale(1.1)}
.hero{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.artw{animation:drift 14s ease-in-out infinite alternate}
.pic{perspective:500px;animation:picIn .9s cubic-bezier(.2,1.3,.3,1) .15s both,floaty 5s ease-in-out 1.1s infinite}
.hero h1{animation:rise .7s cubic-bezier(.2,.8,.2,1) .3s both}.hero p{animation:rise .7s cubic-bezier(.2,.8,.2,1) .45s both}
.bar{animation:rise .6s cubic-bezier(.2,.8,.2,1) .2s both}
.bar input{transition:box-shadow .3s,border-color .3s}.bar input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
.cnt{font-size:12px;font-weight:700;color:var(--acc);background:var(--accbg);border-radius:999px;padding:5px 11px;min-width:92px;text-align:center}
.cnt.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
#list{transition:opacity .2s,transform .22s cubic-bezier(.5,0,.8,.4),filter .2s}
#list.out{opacity:0;transform:translateX(var(--dx,0)) scale(.985);filter:blur(7px)}
section{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
section h2{position:relative;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
section h2:not(.in){opacity:0;transform:translateX(-16px)}
section h2:after{content:"";display:block;height:3px;width:0;margin-top:6px;border-radius:2px;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1) .15s}
section h2.in:after{width:42px}
.rule{transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s}
.rule:not(.in){opacity:0;transform:translateY(26px) scale(.97)}
.rule.in:hover{transform:translateY(-3px);border-color:rgba(210,80,74,.45);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.rule:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);transform:scaleY(0);transform-origin:top;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.rule:hover:before{transform:scaleY(1)}
.rule:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),var(--accbg),transparent 65%)}
.rule:hover:after{opacity:1}
.rule.in .n{animation:badge .7s cubic-bezier(.3,1.7,.5,1) .15s both}
.n{transition:transform .35s cubic-bezier(.3,1.7,.5,1),background .25s,color .25s}
.rule:hover .n{transform:rotate(-6deg) scale(1.1);background:var(--acc);color:#fff}
.rule:not(.in) .pun span,.rule:not(.in) .pun em{opacity:0}
.rule.in .pun span{animation:chipPop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.3s + var(--j)*90ms)}
.rule.in .pun span.hot{animation:chipPop .5s cubic-bezier(.3,1.6,.5,1) both,pulse 2.6s ease-in-out infinite;animation-delay:calc(.3s + var(--j)*90ms),calc(1.2s + var(--j)*90ms)}
.rule.in .pun em{animation:fade .4s both;animation-delay:calc(.2s + var(--j)*90ms)}
mark{background:var(--accbg);color:var(--acc);border-radius:4px;padding:0 2px;animation:mk .7s ease-out}
.empty{animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes chipPop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes badge{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes picIn{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translate(-14px,-6px)}to{transform:translate(14px,8px)}}
@keyframes blob{to{transform:translate(55vw,60vh)}}
@keyframes dot{0%{box-shadow:0 0 0 0 rgba(210,80,74,.7)}100%{box-shadow:0 0 0 9px rgba(210,80,74,0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(210,80,74,0)}50%{box-shadow:0 0 0 4px rgba(210,80,74,.2)}}
@keyframes bump{0%{transform:scale(.8)}100%{transform:none}}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes mk{from{background:var(--acc);color:#fff}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rule:not(.in),section h2:not(.in){opacity:1;transform:none}.rule:not(.in) .pun span,.rule:not(.in) .pun em{opacity:1}}
@media (max-width:820px){.wrap{grid-template-columns:1fr;gap:12px;padding:12px 12px 48px}.side{display:contents}.me,.tabs{display:none}.logo{padding:4px 2px 0}nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:8px 12px;border-radius:0 0 18px 18px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}nav::-webkit-scrollbar{display:none}nav a{white-space:nowrap;flex:none;padding:11px 14px}.rule{grid-template-columns:1fr}.n{grid-row:auto;width:auto;height:24px;padding:0 10px;justify-self:start;margin-bottom:4px}.bar{flex-wrap:nowrap;padding:8px}.bar input{min-width:0;font-size:16px}.cnt{min-width:0;white-space:nowrap;padding:6px 10px}}
@media (max-width:600px){.hero{min-height:200px;border-radius:18px}.hero .in{padding:16px;gap:14px}.pic img{width:76px;height:76px;border-radius:20px}.hero h1{font-size:23px}.hero p{font-size:13px}section{padding:14px;border-radius:16px}section h2{font-size:15.5px}.rule{padding:12px 13px}.rule h3{font-size:14px}.rule p{font-size:13.5px}.pun span{font-size:12px}.artw{inset:-16px}}
@media (hover:none){nav a:hover{transform:none}.rule.in:hover{transform:none;box-shadow:none;border-color:var(--line)}.rule:hover:before{transform:scaleY(0)}.rule:hover:after{opacity:0}.rule:hover .n{transform:none;background:var(--accbg);color:var(--acc)}.me:hover img{transform:none}}
</style>
</head>
<body>
<div class="wrap">
<aside class="side">
 <div class="logo"><i></i>FernieID</div>
 <div class="me"><img src="icon.png" alt="FernieX"><div><b>FernieX</b><span>Официальные чаты</span></div></div>
 <nav id="nav"></nav>
</aside>
<main class="main">
 <div class="hero"><div class="artw"><img class="art" src="icon.png" alt=""></div><div class="in"><div class="pic"><img src="icon.png" alt="FernieX"></div><div><h1>Правила официальных чатов</h1><p>Одно место для всех правил и наказаний. Найдите нужный пункт поиском или откройте раздел слева.</p></div></div></div>
 <div class="bar"><input id="q" type="search" placeholder="Поиск по правилам: мут, мультиаккаунт, голос…" aria-label="Поиск"><span class="cnt" id="cnt"></span><div class="tabs" id="tabs"></div></div>
 <div id="list"></div>
 <div class="empty" id="empty">Ничего не нашлось. Попробуйте другое слово.</div>
</main>
</div>

var S=[
["Безопасность и уважение к участникам",[
["1.1","Оскорбления, травля, угрозы и разжигание ненависти","Целенаправленные унижения, систематическая травля, прямые или косвенные угрозы, высказывания, разжигающие вражду по признаку расы, национальности, религии, пола и т.д.","Предупреждение → Мут 1 час → Бан"],
["1.2","Раскрытие личной информации (доксинг)","Публикация личных данных другого человека без его согласия: реальное имя, адрес, телефон, ссылки на личные соцсети, рабочие данные.","Мут 3 часа → Бан. При повторном или особо серьёзном нарушении сразу бан"],
["1.3","Оскорбление родственников","Оскорбления, унижения или негативные высказывания в адрес родственников участников чата.","Мут 1–3 часа → Бан на 3–7 дней"]]],
["Запрещённый и нежелательный контент",[
["2.1","Нелегальный и крайне опасный контент","Детская порнография, экстремизм, терроризм, призывы к насилию или суициду, распространение наркотиков.","Немедленный бан без предупреждения. В неочевидных случаях: мут 3 часа → Бан"],
["2.2","Спам, флуд и несогласованная реклама","Частая отправка бессмысленных сообщений или символов, CAPS LOCK, навязчивое копирование текста, реклама ресурсов и услуг без разрешения администрации.","Предупреждение → Мут 12 часов → Бан"],
["2.3","Контент 18+","Публикация и обсуждение порнографических материалов и шок-контента сексуального характера.","Предупреждение → Мут 1 час → Бан"]]],
["Взаимодействие с модерацией",[
["3.1","Подрыв авторитета модерации","Публичные призывы игнорировать решения модераторов, оскорбление модераторов, обсуждение действий администрации в общем чате. Спорные вопросы решаются в личных сообщениях.","Мут 5 часов"],
["3.2","Клевета и ложные обвинения","Заведомо ложные заявления о действиях участников или модераторов, попытки спровоцировать санкции против невиновного.","Мут 30 минут → При повторении санкции ужесточаются"]]],
["Голосовые чаты и сообщения",[
["4.1","Нарушение правил общения в голосе","Оскорбления, крики, спам, реклама, создание некомфортной обстановки для других участников.","Мут в голосовом чате 30 минут → Мут 3 часа → Бан"],
["4.2","Изменение голоса","Запрещено использовать в голосовых чатах и голосовых сообщениях любые средства, изменяющие голос или речь: войс-чейнджеры, голосовые моды, программы и фильтры для изменения тембра, высоты, пола или имитации чужого голоса, а также ИИ-озвучку и клонирование голоса. Стандартное шумоподавление и эхоподавление разрешено, если голос остаётся вашим.","Предупреждение → Мут в голосовом чате 3 часа → Бан"],
["4.3","Воспроизведение звука через микрофон","Запрещено транслировать через микрофон звуки, музыку или записи с помощью саундпадов, ботов и сторонних программ, если это мешает другим участникам или нарушает правила чата. Если звук содержит нарушение из разделов 1–2, санкция назначается по соответствующему пункту.","Мут в голосовом чате 3 часа → Бан"]]],
["Ссылки и внешние ресурсы",[
["5.1","Запрещённые ссылки","Ссылки на запрещённые сайты, вредоносное ПО, пиратский контент.","Немедленный бан без предупреждения"],
["5.2","Ссылки на непроверенные источники","Публикация ссылок на сайты и ресурсы, безопасность которых не подтверждена: подозрительные домены, сокращённые ссылки без пояснения, файлы из неизвестных источников.","Предупреждение → Мут 1 час → Бан"]]],
